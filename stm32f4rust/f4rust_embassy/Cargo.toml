[package]
name = "f4_embassy"
edition = "2024"
version = "0.1.0"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-stm32 = { version = "0.6", features = ["stm32f407zg", "time-driver-tim9", "unstable-pac"] }
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
static_cell = "2"
heapless = "0.9"

# cargo build/run
[profile.dev]
opt-level = 's'
codegen-units = 1

# cargo build/run --release
[profile.release]
opt-level = 's'
codegen-units = 1
lto = 'fat'
debug = 2
