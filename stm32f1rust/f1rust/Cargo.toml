[package]
name = "f1rust"
edition = "2024"
version = "0.1.0"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32f1xx-hal = { version = "0.11.0", features = ["stm32f103"] }
nb = "1"

# cargo build/run
[profile.dev]
opt-level = 's'
codegen-units = 1

# cargo build/run --release
[profile.release]
opt-level = 's'
codegen-units = 1
lto = 'fat'
debug = 2
